<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div id="main">
    <h4>T A B L E</h4>
    <div id="table1">
      <table>
        <tr>
          <td>1, 1</td>
          <td>1, 2</td>
        </tr>
        <tr>
          <td>2, 1</td>
          <td>2, 2</td>
        </tr>
        <tr>
          <td>3, 1</td>
          <td>3, 2</td>
        </tr>
      </table>
    </div>
    <hr />
    <h4>T A B L E</h4>
    <h5>border</h5>
    <div id="table2">
      <table>
        <tr>
          <td>1, 1</td>
          <td>1, 2</td>
        </tr>
        <tr>
          <td>2, 1</td>
          <td>2, 2</td>
        </tr>
        <tr>
          <td>3, 1</td>
          <td>3, 2</td>
        </tr>
      </table>
    </div>
    <hr />
    <h4>T A B L E</h4>
    <h5>collapse</h5>
    <div id="table3">
      <table>
        <tr>
          <td>1, 1</td>
          <td>1, 2</td>
        </tr>
        <tr>
          <td>2, 1</td>
          <td>2, 2</td>
        </tr>
        <tr>
          <td>3, 1</td>
          <td>3, 2</td>
        </tr>
      </table>
    </div>
    <hr />
    <h4>T A B L E</h4>
    <h5>colspan</h5>
    <div id="table4">
      <table>
        <tr>
          <td colspan="2">1, 1</td>
        </tr>
        <tr>
          <td>2, 1</td>
          <td>2, 2</td>
        </tr>
        <tr>
          <td>3, 1</td>
          <td>3, 2</td>
        </tr>
      </table>
    </div>
    <hr />
    <h4>T A B L E</h4>
    <h5>rowspan</h5>
    <div id="table5">
      <table>
        <tr>
          <td rowspan="2">1, 1</td>
          <td>2, 1</td>
        </tr>
        <tr>
          <td>2, 2</td>
        </tr>
        <tr>
          <td>3, 1</td>
          <td>3, 2</td>
        </tr>
      </table>
    </div>
    <hr />
    <h4>T A B L E</h4>
    <h5>header</h5>
    <div id="table6">
      <table>
        <thead>
          <tr>
            <td>column 1</td>
            <td>column 2</td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>1, 1</td>
            <td>2, 1</td>
          </tr>
          <tr>
            <td>2, 1</td>
            <td>2, 2</td>
          </tr>
          <tr>
            <td>3, 1</td>
            <td>3, 2</td>
          </tr>
        </tbody>
      </table>
    </div>
    <hr />
  </div>
</body>

</html>
