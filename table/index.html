<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>practice of table</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <p> 1st table</p>
  <div id="table1">
    <table>
      <thead>
      <tr>
        <th>head 1</th>
        <th>head 2</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td>1,1</td>
        <td>1,2</td>
      </tr>
      <tr>
        <td>2,1</td>
        <td>2,2</td>
      </tr>
      <tr>
        <td>3,1</td>
        <td>3,2</td>
      </tr>
      </tbody>
    </table>
  </div>
  <p> 2nd table</p>
  <div id="table2">
    <table>
      <thead>
      <tr>
        <th>head 1</th>
        <th>head 2</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td>1,1</td>
        <td>1,2</td>
      </tr>
      <tr>
        <td>2,1</td>
        <td>2,2</td>
      </tr>
      <tr>
        <td>3,1</td>
        <td>3,2</td>
      </tr>
      </tbody>
    </table>
  </div>
  <p> 3rd table(with collapse)</p>
  <div id="table3">
    <table>
      <thead>
      <tr>
        <th>head 1</th>
        <th>head 2</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td>1,1</td>
        <td>1,2</td>
      </tr>
      <tr>
        <td>2,1</td>
        <td>2,2</td>
      </tr>
      <tr>
        <td>3,1</td>
        <td>3,2</td>
      </tr>
      </tbody>
    </table>
  </div>
  <p> 4th table(with colspan)</p>
  <div id="table4">
    <table>
      <thead>
      <tr>
        <th>head 1</th>
        <th>head 2</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td colspan="2">1,2</td>
      </tr>
      <tr>
        <td>2,1</td>
        <td>2,2</td>
      </tr>
      <tr>
        <td>3,1</td>
        <td>3,2</td>
      </tr>
      </tbody>
    </table>
  </div>
  <p> 5th table(with rowspan)</p>
  <div id="table5">
    <table>
      <thead>
      <tr>
        <th>head 1</th>
        <th>head 2</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <td rowspan="2">1,2</td>
        <td>1,2</td>
      </tr>
      <tr>
        <td>2,2</td>
      </tr>
      <tr>
        <td>3,1</td>
        <td>3,2</td>
      </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
